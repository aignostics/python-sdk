name: "> Claude Code"

on:
  workflow_call:
    inputs:
      mode:
        description: 'Mode: interactive or automation'
        required: true
        type: string
      prompt:
        description: 'Prompt for automation mode'
        required: false
        type: string
      max_turns:
        description: 'Maximum number of turns for Claude'
        required: false
        default: '200'
        type: string
      allowed_tools:
        description: 'Allowed tools for Claude'
        required: false
        default: 'mcp__github_inline_comment__create_inline_comment,Read,Write,Edit,MultiEdit,Glob,Grep,LS,WebFetch,WebSearch,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(uv:*),Bash(make:*),Bash(export:*)'
        type: string
      track_progress:
        description: 'Track progress (set to false for workflow_dispatch)'
        required: false
        default: true
        type: boolean
      use_sticky_comment:
        description: 'Use just one comment to deliver PR comments (only applies for pull_request event workflows)'
        required: false
        default: false
        type: boolean

jobs:
  claude-code:
    runs-on: ubuntu-latest
    permissions:
      actions: read # github_ci MCP server of claude-code-action reads workflow runs and job logs
      contents: read
      id-token: write # anthropics/claude-code-action exchanges the OIDC token for the Claude App token and the Anthropic API token
      pull-requests: read # github_ci MCP server of claude-code-action reads the pull request (pulls.get)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.mode == 'interactive' && 0 || 1 }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: "pyproject.toml"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dev tools
        shell: bash
        run: .github/workflows/_install_dev_tools.bash
        
      - name: Install Python, venv and dependencies
        shell: bash
        run: uv sync --all-extras --locked --link-mode=copy

      - name: Setup display
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2

      - name: Print development version info
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          TOML_VERSION=$(uv run --locked python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Development build - Current version in pyproject.toml: $TOML_VERSION"

      - name: Run Claude Code (Interactive Mode)
        if: inputs.mode == 'interactive'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          # Workload identity federation: the job's GitHub OIDC token is exchanged
          # for a short-lived Anthropic token. Values are repository-level Actions
          # variables (identifiers, not secrets): a public repository cannot see the
          # org-level ones. Do not also set anthropic_api_key: a static key takes
          # precedence and federation is silently skipped.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          track_progress: ${{ inputs.track_progress }}
          additional_permissions: |
            actions: read
          allowed_bots: "dependabot[bot],renovate[bot]"
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --model claude-sonnet-4-5-20250929
            --allowed-tools "${{ inputs.allowed_tools }}"
            --system-prompt "Read the CLAUDE.md file in the root folder of this repository and explicitely acknowledge you will apply **all** guidance therein and in **all** linked documents."

      - name: Run Claude Code (Automation Mode)
        if: inputs.mode == 'automation'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          # Workload identity federation: the job's GitHub OIDC token is exchanged
          # for a short-lived Anthropic token. Values are repository-level Actions
          # variables (identifiers, not secrets): a public repository cannot see the
          # org-level ones. Do not also set anthropic_api_key: a static key takes
          # precedence and federation is silently skipped.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          track_progress: ${{ inputs.track_progress }}
          use_sticky_comment: ${{ inputs.use_sticky_comment }}
          additional_permissions: |
            actions: read
          allowed_bots: "dependabot[bot],renovate[bot]"
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --model claude-sonnet-4-5-20250929
            --allowed-tools "${{ inputs.allowed_tools }}"
            --system-prompt "Read the CLAUDE.md file in this repository and explicitely acknowledge you will apply the guidance therein."
          prompt: ${{ inputs.prompt }}
