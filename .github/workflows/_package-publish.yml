name: "> Publish Package"

on:
  workflow_call:
    inputs:
      commit_message:
        description: "Commit message to check for skip markers"
        required: false
        type: string
    secrets:
      UV_PUBLISH_TOKEN:
        required: true
      SLACK_WEBHOOK_URL_RELEASE_ANNOUNCEMENT:
        required: true
      SLACK_CHANNEL_ID_RELEASE_ANNOUNCEMENT:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true

env:
  # https://gist.github.com/NodeJSmith/e7e37f2d3f162456869f015f842bcf15
  PYTHONIOENCODING: "utf8"

jobs:
  build_native:
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        experimental: [false]
        include:
          - runner: ubuntu-24.04-arm
            experimental: false
          - runner: macos-latest
            experimental: false
          - runner: macos-15-intel
            experimental: false
          - runner: windows-latest
            experimental: false

    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: "pyproject.toml"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python, venv and dependencies
        shell: bash
        run: uv sync --all-extras --frozen --link-mode=copy

      - name: Validate installation
        shell: bash
        run: |
          OUTPUT=$(uv run --frozen --all-extras --no-dev aignostics --help)
          if [[ "$OUTPUT" != *"built with love in Berlin"* ]]; then
          echo "Output does not contain 'built with love in Berlin'"
          exit 1
          fi

      - name: Install upx for native Windows version
        if: ${{ matrix.runner == 'windows-latest' || matrix.runner == 'windows-11-arm' }}
        shell: bash
        run: |
          choco install upx --no-progress

      - name: Build native distribution into dist_native/
        shell: bash
        run: make dist_native

      - name: Upload dist_native artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (env.GITHUB_WORKFLOW_RUNTIME != 'ACT') }}
        with:
          name: dist_native-${{ matrix.runner }}
          path: dist_native/aignostics.7z
          retention-days: 1

  package_publish:
    runs-on: ubuntu-latest
    needs: build_native
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: "pyproject.toml"
          cache-dependency-glob: uv.lock
          enable-cache: true

      - name: Install dev tools
        shell: bash
        run: .github/workflows/_install_dev_tools.bash

      - name: Download native distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist_native-*
          path: dist_native_all/
          merge-multiple: false

      - name: Create zip archives for native executables
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          mkdir -p dist_native_zipped/
          cd dist_native_all/
          for dir in */; do
            if [ -d "$dir" ]; then
              platform_name=${dir%/}
              echo "Processing platform: $platform_name"
              cd "$dir"
              if [ -f "aignostics.7z" ]; then
                echo "Extracting aignostics.7z for $platform_name"
                7z x aignostics.7z -o"extracted/"
                cd extracted/
                zip -ryX "../../../dist_native_zipped/aignostics-$VERSION-$platform_name.zip" .
                cd ..
              else
                echo "Warning: aignostics.7z not found in $platform_name"
              fi
              cd ..
            fi
          done
          cd ..
          ls -la dist_native_zipped/

      - name: Final smoke test
        shell: bash
        run: |
          uv run --frozen --no-dev aignostics --help

      - name: Docs
        shell: bash
        run: make docs

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          config: pyproject.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Print the release notes
        shell: bash
        env:
          GIT_CLIFF_CHANGELOG: ${{ steps.git-cliff.outputs.changelog }}
        run: cat "$GIT_CLIFF_CHANGELOG"

      - name: Verify lockstep versioning
        shell: bash
        run: |
          SDK_VERSION=$(grep '^version = ' packages/aignostics-sdk/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          FULL_VERSION=$(grep '^version = ' packages/aignostics/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$SDK_VERSION" != "$FULL_VERSION" ]; then
            echo "❌ Version mismatch: aignostics-sdk=$SDK_VERSION, aignostics=$FULL_VERSION"
            exit 1
          fi
          echo "✅ Versions match: $SDK_VERSION"

      - name: Build aignostics-sdk distribution
        shell: bash
        run: uv build --package aignostics-sdk --out-dir dist/

      - name: Publish aignostics-sdk to PyPI
        shell: bash
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish dist/aignostics_sdk-*

      - name: Build aignostics distribution
        shell: bash
        run: uv build --package aignostics --out-dir dist/

      - name: Publish aignostics to PyPI
        shell: bash
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish dist/aignostics-*

      - name: Download test results for ubuntu-latest generated in _test.yml
        if: |
          (!contains(inputs.commit_message, 'skip:test:all')) &&
          (!contains(github.event.pull_request.labels.*.name, 'skip:test:all'))
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-ubuntu-latest
          path: test-results

      - name: Download audit results generated in _audit.yml
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audit-results
          path: audit-results

      - name: Create GitHub release
        if: |
          (!contains(inputs.commit_message, 'skip:test:all')) &&
          (!contains(github.event.pull_request.labels.*.name, 'skip:test:all'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GIT_CLIFF_CHANGELOG: ${{ steps.git-cliff.outputs.changelog }}
        shell: bash
        run: |
          rm -rf ./test-results/coverage_html
          gh release create "$GH_REF_NAME" ./dist/* ./dist_native_zipped/* ./test-results/* ./audit-results/*   \
            --notes-file "$GIT_CLIFF_CHANGELOG"

      - name: Create GitHub release (no test results)
        if: |
          (contains(inputs.commit_message, 'skip:test:all')) ||
          (contains(github.event.pull_request.labels.*.name, 'skip:test:all'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GIT_CLIFF_CHANGELOG: ${{ steps.git-cliff.outputs.changelog }}
        shell: bash
        run: |
          rm -rf ./test-results/coverage_html
          gh release create "$GH_REF_NAME" ./dist/* ./dist_native_zipped/* ./audit-results/*   \
            --notes-file "$GIT_CLIFF_CHANGELOG"

      - name: Inform Sentry about release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          release: ${{ github.ref_name }}

      - name: Convert release notes from Markdown to Slack mrkdwn
        shell: bash
        env:
          GIT_CLIFF_CONTENT: ${{ steps.git-cliff.outputs.content }}
        run: |
          # Convert Markdown links [text](url) to Slack mrkdwn <url|text>
          # Convert bold **text** to *text*
          NOTES_CONVERTED=$(printf '%s\n' "$GIT_CLIFF_CONTENT" | \
            sed -E 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' | \
            sed -E 's/\*\*([^*]+)\*\*/*\1*/g')
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          if [ "$(printf '%s' "$NOTES_CONVERTED" | wc -c)" -gt 2700 ]; then
            NOTES_TRUNCATED=$(printf '%s' "$NOTES_CONVERTED" | head -c 2700)
            NOTES_CONVERTED="${NOTES_TRUNCATED}"$'\n'"...<${RELEASE_URL}|Read full release notes>"
          fi
          # JSON-escape: backslashes first, then double quotes, then collapse newlines to \n
          NOTES=$(printf '%s' "$NOTES_CONVERTED" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "SLACK_RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Release Announcement
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_RELEASE_ANNOUNCEMENT }}
          webhook-type: webhook-trigger
          payload: |
            {
              "repository": "${{ github.repository }}",
              "version": "${{ steps.git-cliff.outputs.version }}",
              "release_notes": "${{ env.SLACK_RELEASE_NOTES }}",
              "channel_id": "${{ secrets.SLACK_CHANNEL_ID_RELEASE_ANNOUNCEMENT }}"
            }

      - name: Allow other workflows to trigger on release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # See https://github.com/cli/cli/discussions/10696
          gh api repos/aignostics/python-sdk/dispatches \
            -f event_type=release_created_programatically

  smoke_test_slim:
    runs-on: ubuntu-latest
    needs: package_publish
    continue-on-error: true
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Smoke test aignostics-sdk
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          uv venv /tmp/slim-venv
          uv pip install --python /tmp/slim-venv/bin/python "aignostics-sdk==$VERSION"
          /tmp/slim-venv/bin/aignostics-sdk --help
          /tmp/slim-venv/bin/python -c "from aignostics_sdk.platform import Client; print('✅ slim import OK')"
          if /tmp/slim-venv/bin/python -c "import openslide" 2>/dev/null; then
            echo "❌ openslide should not be installed in slim package"
            exit 1
          fi
          echo "✅ Heavy deps correctly absent"
