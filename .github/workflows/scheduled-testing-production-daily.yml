name: "+ Scheduled Testing / Production (Daily)"

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (leave empty for main)'
        required: false
        type: string
        default: ''

jobs:

  scheduled-testing-production-daily:
    uses: ./.github/workflows/_scheduled-test-daily.yml
    with:
      platform_environment: "production"
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    secrets:
      AIGNOSTICS_REFRESH_TOKEN_STAGING: ${{ secrets.AIGNOSTICS_REFRESH_TOKEN_STAGING }}
      AIGNOSTICS_REFRESH_TOKEN_PRODUCTION: ${{ secrets.AIGNOSTICS_REFRESH_TOKEN_PRODUCTION }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
