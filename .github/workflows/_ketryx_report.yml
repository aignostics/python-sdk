name: "Report Build to Ketryx"

on:
  workflow_call:
    # No inputs needed at this time

env:
  # https://gist.github.com/NodeJSmith/e7e37f2d3f162456869f015f842bcf15
  PYTHONIOENCODING: "utf8"

jobs:

  ketryx_report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          version: "0.6.3"
          cache-dependency-glob: uv.lock
          enable-cache: true

      - name: Install dev tools
        shell: bash
        run: .github/workflows/_install_dev_tools.bash

      - name: Docs
        shell: bash
        run: make docs

      - name: Download test results for ubuntu-latest generated in _test.yml
        uses: actions/download-artifact@v4
        with:
          name: test-results-ubuntu-latest          

      - name: Debug - List reports directory
        run: |
          ls -la reports/
          find . -name "junit*.xml" -type f
          echo "Contents of junit files:"
          cat reports/junit_*.xml | head -20

      - name: Have audit checks publish to reports/ for auditing
        shell: bash
        run: make audit

      - name: Report build to Ketryx
        uses: Ketryx/ketryx-github-action@v1.4.0
        with:
          project: ${{ secrets.KETRYX_PROJECT }}
          api-key: ${{ secrets.KETRYX_API_KEY }}
          artifact-path: |
            reports/coverage.xml
          test-junit-path: reports/junit_*.xml
          cyclonedx-json-path: |
            reports/sbom.json
