name: "Build Native Only"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  release:
    types: [created]

jobs:
  only_build_native:
    if: (contains(github.event.head_commit.message, 'build:native:only'))
    uses: ./.github/workflows/_build-native-only.yml
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    secrets: inherit
