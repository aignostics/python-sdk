name: "+ Scheduled Audit (Hourly)"

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (leave empty for main)'
        required: false
        type: string
        default: ''

jobs:
  audit-scheduled:
    uses: ./.github/workflows/_scheduled-audit.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      BETTERSTACK_AUDIT_HEARTBEAT_URL: ${{ secrets.BETTERSTACK_AUDIT_HEARTBEAT_URL }}
