name: "> Ketryx Report and Check"

on:
  workflow_call:
    inputs:
      commit_message:
        description: 'Commit message to check for skip markers'
        required: false
        type: string
      commit-sha:
        description: 'Commit SHA to associate the build with (used when version is not set)'
        required: false
        type: string
      version:
        description: 'Ketryx version ID to associate the build with; takes precedence over commit-sha (use on release/v* branches)'
        required: false
        type: string
    secrets:
      KETRYX_PROJECT:
        required: false
      KETRYX_API_KEY:
        required: false

env:
  # https://gist.github.com/NodeJSmith/e7e37f2d3f162456869f015f842bcf15
  PYTHONIOENCODING: "utf8"

jobs:
  ketryx_report_and_check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download test results for ubuntu-latest generated in _test.yml
        if: |
          !contains(inputs.commit_message, 'skip:ketryx') &&
          !contains(github.event.pull_request.labels.*.name, 'skip:ketryx')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-ubuntu-latest
          path: test-results

      - name: Download audit results generated in _audit.yml
        if: |
          !contains(inputs.commit_message, 'skip:ketryx') &&
          !contains(github.event.pull_request.labels.*.name, 'skip:ketryx')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audit-results
          path: audit-results

      - name: Report test results to Ketryx
        if: |
          !contains(inputs.commit_message, 'skip:ketryx') &&
          !contains(github.event.pull_request.labels.*.name, 'skip:ketryx')
        uses: Ketryx/ketryx-github-action@40b13ef68c772e96e58ec01a81f5b216d7710186 # v1.4.0
        with:
          project: ${{ secrets.KETRYX_PROJECT }}
          api-key: ${{ secrets.KETRYX_API_KEY }}
          commit-sha: ${{ inputs.version == '' && inputs.commit-sha || '' }}
          version: ${{ inputs.version }}
          build-name: "ci-cd-tests"
          test-junit-path: test-results/junit_*.xml
          artifact-path: |
            test-results/coverage.xml
            test-results/coverage.md

      - name: Report audit results to Ketryx
        if: |
          !contains(inputs.commit_message, 'skip:ketryx') &&
          !contains(github.event.pull_request.labels.*.name, 'skip:ketryx')
        uses: Ketryx/ketryx-github-action@40b13ef68c772e96e58ec01a81f5b216d7710186 # v1.4.0
        with:
          project: ${{ secrets.KETRYX_PROJECT }}
          api-key: ${{ secrets.KETRYX_API_KEY }}
          commit-sha: ${{ inputs.version == '' && inputs.commit-sha || '' }}
          version: ${{ inputs.version }}
          build-name: "ci-cd-audit"
          cyclonedx-json-path: |
            audit-results/sbom.json
          artifact-path: |
            audit-results/sbom.spdx
            audit-results/licenses.csv
            audit-results/licenses.json
            audit-results/licenses_grouped.json
            audit-results/vulnerabilities.json
