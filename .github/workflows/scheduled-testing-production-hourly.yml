name: "+ Scheduled Testing / Production (Hourly)"

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (leave empty for main)'
        required: false
        type: string
        default: ''

jobs:
  scheduled-testing-production-hourly:
    uses: ./.github/workflows/_scheduled-test-hourly.yml
    with:
      platform_environment: "production"
    permissions:
      contents: read
    secrets:
      AIGNOSTICS_REFRESH_TOKEN_STAGING: ${{ secrets.AIGNOSTICS_REFRESH_TOKEN_STAGING }}
      AIGNOSTICS_REFRESH_TOKEN_PRODUCTION: ${{ secrets.AIGNOSTICS_REFRESH_TOKEN_PRODUCTION }}
