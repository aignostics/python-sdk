name: "CI/CD"

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  release:
    types: [created]

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
    permissions:
      contents: read
      id-token: write
      packages: read
    secrets: inherit

  audit:
    uses: ./.github/workflows/_audit.yml
    permissions:
      contents: read
      id-token: write
      packages: read
    secrets: inherit
    
  test:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    uses: ./.github/workflows/_test.yml



  package_publish:

    needs: [lint, audit, test] 

    if: (startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/_package-publish.yml
    permissions:
      contents: write
      packages: read
    secrets: inherit

  docker_publish:

    needs: [lint, audit, test]

    if: (startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/_docker-publish.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    secrets: inherit


