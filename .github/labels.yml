# GitHub Labels Configuration
# 
# This file defines all labels used in the repository.
# Labels are automatically synced by .github/workflows/labels-sync.yml
# when this file is modified and pushed to main branch.
# 
# Manual sync: gh label sync -f .github/labels.yml

# Standard GitHub Labels
- name: bug
  description: Something isn't working
  color: "d73a4a"

- name: documentation
  description: Improvements or additions to documentation
  color: "0075ca"

- name: duplicate
  description: This issue or pull request already exists
  color: "cfd3d7"

- name: enhancement
  description: New feature or request
  color: "a2eeef"

- name: good first issue
  description: Good for newcomers
  color: "7057ff"

- name: help wanted
  description: Extra attention is needed
  color: "008672"

- name: invalid
  description: This doesn't seem right
  color: "e4e669"

- name: question
  description: Further information is requested
  color: "d876e3"

- name: wontfix
  description: This will not be worked on
  color: "ffffff"

# Dependency Management Labels
- name: dependencies
  description: Pull requests that update a dependency file
  color: "0366d6"

- name: github_actions
  description: Pull requests that update GitHub Actions
  color: "000000"

- name: python
  description: Pull requests that update python code
  color: "2b67c6"

# Bot Labels
- name: bot
  description: Automated pull requests or issues
  color: "b1aa07"

- name: dependabot
  description: Pull requests from Dependabot
  color: "97827a"

- name: renovate
  description: Pull requests from Renovate
  color: "d1df30"

# CI/CD Skip Labels
- name: skip:ci
  description: Skip entire CI/CD pipeline
  color: "b167f6"

- name: skip:test:all
  description: Skip all test executions
  color: "5e0647"

- name: skip:test:long_running
  description: Skip long-running tests (≥5min)
  color: "910432"

- name: skip:test:e2e
  description: Skip end-to-end tests
  color: "0dc59c"

- name: skip:test:integration
  description: Skip integration tests
  color: "64ac56"

- name: skip:test:unit
  description: Skip unit tests
  color: "614318"

- name: skip:codecov
  description: Skip Codecov reporting and check
  color: "8b4512"

- name: skip:ketryx
  description: Skip Ketryx ALM reporting and checks
  color: "8b4513"

# CI/CD Enable Labels
- name: enable:test:very_long_running
  description: Enable very long-running tests (≥60min)
  color: "9033fe"

# Build Control Labels
- name: build:native:only
  description: Build native packages only (macOS/Windows apps)
  color: "1d76db"

# AI Assistant Labels
- name: claude
  description: Trigger Claude Code automation
  color: "b41d8f"

- name: copilot
  description: GitHub Copilot related
  color: "e6dac6"

# Quality Assurance Labels
- name: code-quality
  description: Code quality and maintainability issues
  color: "fbca04"

- name: automated-check
  description: Issue created by automated quality checks
  color: "ededed"

- name: documentation-drift
  description: Documentation out of sync with code
  color: "ff6b6b"

# SOP Labels — governance trail on every PR (one mandatory)
- name: sop:pr-sop-01
  description: PR-SOP-01 Problem Resolution (bug / anomaly fix)
  color: "5319e7"

- name: sop:cc-sop-01
  description: CC-SOP-01 Change Control (feature / planned change)
  color: "1d76db"

# Type Labels — conventional-commits taxonomy (one per PR)
# Extends the legacy `bug` / `documentation` / `enhancement` labels with
# the rest of the conventional-commit vocabulary. Legacy labels remain
# for backward-compatibility with issue templates and external tooling;
# the `type:*` namespace is the source of truth for PR-level filtering.
- name: type:feature
  description: New functionality (conventional feat)
  color: "a2eeef"

- name: type:fix
  description: Bug fix (conventional fix)
  color: "d73a4a"

- name: type:chore
  description: Tooling, maintenance, routine task (conventional chore)
  color: "c5def5"

- name: type:refactor
  description: Refactor without behaviour change
  color: "fbca04"

- name: type:docs
  description: Documentation-only change
  color: "0075ca"

- name: type:test
  description: Test-only change
  color: "006b75"

- name: type:perf
  description: Performance improvement
  color: "4b0082"

- name: type:build
  description: Build / packaging change
  color: "5319e7"

- name: type:ci
  description: CI/CD change
  color: "000000"

# Security Labels — orthogonal axis (0–2 per PR)
- name: security
  description: Addresses a security advisory, CVE, or hardens security posture
  color: "b60205"

- name: security:supply-chain
  description: Supply-chain (dependency) vulnerability remediation
  color: "d93f0b"

# Scope Labels — who the change affects (0–1 per PR)
- name: scope:sdk-consumers
  description: Affects downstream SDK consumers (uvx aignostics / uv add aignostics)
  color: "0e8a16"

- name: scope:dev-only
  description: Affects only our dev/CI env; consumers unaffected
  color: "bfdadc"

# Automation Labels
- name: auto-merge
  description: Eligible for auto-merge once CI is green
  color: "0e8a16"
