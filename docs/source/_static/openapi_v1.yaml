info:
  description: "\nThe Aignostics Platform is a cloud-based service that enables organizations\
    \ to access advanced computational pathology applications through a secure API.\
    \  The platform provides standardized access to Aignostics' portfolio of computational\
    \ pathology solutions, with Atlas H&E-TME serving as an example of the available\
    \ API endpoints. \n\nTo begin using the platform, your organization must first\
    \ be registered by our business support team. If you don't have an account yet,\
    \ please contact your account manager or email support@aignostics.com to get started.\
    \ \n\nMore information about our applications can be found on (https://platform.aignostics.com).\n\
    \n**How to authorize and test API endpoints:**\n\n1. Click the \"Authorize\" button\
    \ in the right corner below\n3. Click \"Authorize\" button in the dialog to log\
    \ in with your Aignostics Platform credentials\n4. After successful login, you'll\
    \ be redirected back and can use \"Try it out\" on any endpoint\n\n**Note**: You\
    \ only need to authorize once per session. The lock icons next to endpoints will\
    \ show green when authorized.\n\n"
  title: Aignostics Platform API
  version: 1.0.0-beta6
openapi: 3.1.0
paths:
  /v1/applications:
    get:
      description: "Returns the list of the applications, available to the caller.\n\
        \nThe application is available if any of the versions of the application is\
        \ assigned to the caller\u2019s organization.\nThe response is paginated and\
        \ sorted according to the provided parameters."
      operationId: list_applications_v1_applications_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 5
          title: Page Size
          type: integer
      - description: 'Sort the results by one or more fields. Use `+` for ascending
          and `-` for descending order.


          **Available fields:**

          - `application_id`

          - `name`

          - `description`

          - `regulatory_classes`


          **Examples:**

          - `?sort=application_id` - Sort by application_id ascending

          - `?sort=-name` - Sort by name descending

          - `?sort=+description&sort=name` - Sort by description ascending, then name
          descending'
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'Sort the results by one or more fields. Use `+` for ascending
            and `-` for descending order.


            **Available fields:**

            - `application_id`

            - `name`

            - `description`

            - `regulatory_classes`


            **Examples:**

            - `?sort=application_id` - Sort by application_id ascending

            - `?sort=-name` - Sort by name descending

            - `?sort=+description&sort=name` - Sort by description ascending, then
            name descending'
          title: Sort
      responses:
        '200':
          content:
            application/json:
              example:
              - application_id: he-tme
                description: The Atlas H&E TME is an AI application designed to examine
                  FFPE (formalin-fixed, paraffin-embedded) tissues stained with H&E
                  (hematoxylin and eosin), delivering comprehensive insights into
                  the tumor microenvironment.
                name: Atlas H&E-TME
                regulatory_classes:
                - RUO
              - application_id: test-app
                description: 'This is the test application with two algorithms: TissueQc
                  and Tissue Segmentation'
                name: Test Application
                regulatory_classes:
                - RUO
              schema:
                items:
                  $ref: '#/components/schemas/ApplicationReadResponse'
                title: Response List Applications V1 Applications Get
                type: array
          description: A list of applications available to the caller
        '401':
          description: Unauthorized - Invalid or missing authentication
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: List available applications
      tags:
      - Public
  /v1/applications/{application_id}:
    get:
      description: Retrieve details of a specific application by its ID.
      operationId: read_application_by_id_v1_applications__application_id__get
      parameters:
      - in: path
        name: application_id
        required: true
        schema:
          title: Application Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationReadResponse'
          description: Successful Response
        '403':
          description: Forbidden - You don't have permission to see this application
        '404':
          description: Not Found - Application with the given ID does not exist
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: Read Application By Id
      tags:
      - Public
  /v1/applications/{application_id}/versions:
    get:
      description: 'Returns a list of available application versions for a specific
        application.


        A version is considered available when it has been assigned to your organization.
        Within a major version,

        all minor and patch updates are automatically accessible unless a specific
        version has been deprecated.

        Major version upgrades, however, require explicit assignment and may be subject
        to contract modifications

        before becoming available to your organization.'
      operationId: list_versions_by_application_id_v1_applications__application_id__versions_get
      parameters:
      - in: path
        name: application_id
        required: true
        schema:
          title: Application Id
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 5
          title: Page Size
          type: integer
      - description: 'Semantic version of the application, example: `1.0.13`'
        in: query
        name: version
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Semantic version of the application, example: `1.0.13`'
          examples:
          - 1.0.0
          - 1.0.13
          title: Version
      - description: 'Sort the results by one or more fields. Use `+` for ascending
          and `-` for descending order.


          **Available fields:**

          - `application_version_id`

          - `version`

          - `application_id`

          - `changelog`

          - `created_at`


          **Examples:**

          - `?sort=application_id` - Sort by application_id ascending

          - `?sort=-version` - Sort by version descending

          - `?sort=+application_id&sort=-created_at` - Sort by application_id ascending,
          then created_at descending'
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'Sort the results by one or more fields. Use `+` for ascending
            and `-` for descending order.


            **Available fields:**

            - `application_version_id`

            - `version`

            - `application_id`

            - `changelog`

            - `created_at`


            **Examples:**

            - `?sort=application_id` - Sort by application_id ascending

            - `?sort=-version` - Sort by version descending

            - `?sort=+application_id&sort=-created_at` - Sort by application_id ascending,
            then created_at descending'
          title: Sort
      responses:
        '200':
          content:
            application/json:
              example:
              - application_id: he-tme
                application_version_id: he-tme:v0.5.0
                changelog: 'Redeployed after metadata name changes. '
                created_at: '2025-06-03T11:45:55.646211Z'
                input_artifacts:
                - metadata_schema:
                    $defs:
                      LungCancerSpecimen:
                        additionalProperties: false
                        properties:
                          disease:
                            const: LUNG_CANCER
                            enum:
                            - LUNG_CANCER
                            title: Disease
                            type: string
                          tissue:
                            enum:
                            - LUNG
                            - LYMPH_NODE
                            - LIVER
                            - ADRENAL_GLAND
                            - BONE
                            - BRAIN
                            title: Tissue
                            type: string
                        required:
                        - disease
                        - tissue
                        title: LungCancerSpecimen
                        type: object
                    $schema: http://json-schema.org/draft-07/schema#
                    additionalProperties: false
                    description: Schema of a slide.
                    properties:
                      checksum_base64_crc32c:
                        title: Base64 encoded big-endian CRC32C checksum
                        type: string
                      height_px:
                        minimum: 1
                        title: Height (px)
                        type: integer
                      media_type:
                        enum:
                        - application/dicom
                        - image/tiff
                        - application/octet-stream
                        - application/zip
                        title: Media Type
                        type: string
                      resolution_mpp:
                        maximum: 0.5
                        minimum: 0.125
                        title: Resolution (mpp)
                        type: number
                      specimen:
                        anyOf:
                        - $ref: '#/$defs/LungCancerSpecimen'
                        title: Specimen
                      staining_method:
                        const: H&E
                        enum:
                        - H&E
                        title: Staining Method
                        type: string
                      width_px:
                        minimum: 1
                        title: Width (px)
                        type: integer
                    required:
                    - media_type
                    - checksum_base64_crc32c
                    - specimen
                    - resolution_mpp
                    - width_px
                    - height_px
                    - staining_method
                    title: Slide Schema
                    type: object
                  mime_type: image/tiff
                  name: user_slide
                output_artifacts:
                - metadata_schema:
                    $schema: http://json-schema.org/draft-07/schema#
                    additionalProperties: false
                    description: Metadata corresponding to GeoJSON polygons.
                    properties:
                      checksum_base64_crc32c:
                        title: Base64 encoded big-endian CRC32C checksum
                        type: string
                      media_type:
                        const: application/geo+json
                        default: application/geo+json
                        enum:
                        - application/geo+json
                        title: Media Type
                        type: string
                      polygon_mpp:
                        title: Polygon Mpp
                        type: number
                    required:
                    - checksum_base64_crc32c
                    - polygon_mpp
                    title: GeoJsonPolygonsMetadata
                    type: object
                  mime_type: image/tiff
                  name: tissue_qc:geojson_polygons
                  scope: ITEM
                version: 0.5.0
              schema:
                items:
                  $ref: '#/components/schemas/ApplicationVersionReadResponse'
                title: Response List Versions By Application Id V1 Applications 
Application
                  Id  Versions Get
                type: array
          description: A list of application versions for a given application ID available
            to the caller
        '401':
          description: Unauthorized - Invalid or missing authentication
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: List Available Application Versions
      tags:
      - Public
