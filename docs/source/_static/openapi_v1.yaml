  /v1/runs:
    get:
      description: 'List application runs with filtering, sorting, and pagination
        capabilities.


        Returns paginated application runs that were triggered by the user.'
      operationId: list_application_runs_v1_runs_get
      parameters:
      - description: Optional application ID filter
        in: query
        name: application_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional application ID filter
          title: Application Id
      - description: Optional application version filter
        in: query
        name: application_version
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional application version filter
          title: Application Version
      - description: "Use PostgreSQL JSONPath expressions to filter runs by their\
          \ metadata.\n#### URL Encoding Required\n**Important**: JSONPath expressions\
          \ contain special characters that must be URL-encoded when used in query\
          \ parameters. Most HTTP clients handle this automatically, but when constructing\
          \ URLs manually, ensure proper encoding.\n\n#### Examples (Clear Format):\n\
          - **Field existence**: `$.project` - Runs that have a project field defined\n\
          - **Exact value match**: `$.project ? (@ == \"cancer-research\")` - Runs\
          \ with specific project value\n- **Numeric comparison**: `$.duration_hours\
          \ ? (@ < 2)` - Runs with duration less than 2 hours\n- **Array operations**:\
          \ `$.tags[*] ? (@ == \"production\")` - Runs tagged with \"production\"\n\
          - **Complex conditions**: `$.resources ? (@.gpu_count > 2 && @.memory_gb\
          \ >= 16)` - Runs with high resource requirements\n\n#### Examples (URL-Encoded\
          \ Format):\n- **Field existence**: `%24.project`\n- **Exact value match**:\
          \ `%24.project%20%3F%20(%40%20%3D%3D%20%22cancer-research%22)`\n- **Numeric\
          \ comparison**: `%24.duration_hours%20%3F%20(%40%20%3C%202)`\n- **Array\
          \ operations**: `%24.tags%5B*%5D%20%3F%20(%40%20%3D%3D%20%22production%22)`\n\
          - **Complex conditions**: `%24.resources%20%3F%20(%40.gpu_count%20%3E%202%20%26%26%20%40.memory_gb%20%3E%3D%2016)`\n\
          \n#### Notes\n- JSONPath expressions are evaluated using PostgreSQL's `@?`\
          \ operator\n- The `$.` prefix is automatically added to root-level field\
          \ references if missing\n- String values in conditions must be enclosed\
          \ in double quotes\n- Use `&&` for AND operations and `||` for OR operations\n\
          - Regular expressions use `like_regex` with standard regex syntax\n- **Remember\
          \ to URL-encode the entire JSONPath expression when making HTTP requests**\n\
          \n            "
        examples:
          array_operations:
            description: Check if an array contains a certain value
            summary: Check if an array contains a certain value
            value: $.tags[*] ? (@ == "production")
          complex_filters:
            description: Combine multiple checks
            summary: Combine multiple checks
            value: $.resources ? (@.gpu_count > 2 && @.memory_gb >= 16)
          field_exists:
            description: Find applications that have a project field defined
            summary: Check if field exists
            value: $.project
          field_has_value:
            description: Compare a field value against a certain value
            summary: Check if field has a certain value
            value: $.project ? (@ == "cancer-research")
          numeric_comparisons:
            description: Compare a field value against a numeric value of a field
            summary: Compare to a numeric value of a field
            value: $.duration_hours ? (@ < 2)
        in: query
        name: metadata
        required: false
        schema:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: "Use PostgreSQL JSONPath expressions to filter runs by their\
            \ metadata.\n#### URL Encoding Required\n**Important**: JSONPath expressions\
            \ contain special characters that must be URL-encoded when used in query\
            \ parameters. Most HTTP clients handle this automatically, but when constructing\
            \ URLs manually, ensure proper encoding.\n\n#### Examples (Clear Format):\n\
            - **Field existence**: `$.project` - Runs that have a project field defined\n\
            - **Exact value match**: `$.project ? (@ == \"cancer-research\")` - Runs\
            \ with specific project value\n- **Numeric comparison**: `$.duration_hours\
            \ ? (@ < 2)` - Runs with duration less than 2 hours\n- **Array operations**:\
            \ `$.tags[*] ? (@ == \"production\")` - Runs tagged with \"production\"\
            \n- **Complex conditions**: `$.resources ? (@.gpu_count > 2 && @.memory_gb\
            \ >= 16)` - Runs with high resource requirements\n\n#### Examples (URL-Encoded\
            \ Format):\n- **Field existence**: `%24.project`\n- **Exact value match**:\
            \ `%24.project%20%3F%20(%40%20%3D%3D%20%22cancer-research%22)`\n- **Numeric\
            \ comparison**: `%24.duration_hours%20%3F%20(%40%20%3C%202)`\n- **Array\
            \ operations**: `%24.tags%5B*%5D%20%3F%20(%40%20%3D%3D%20%22production%22)`\n\
            - **Complex conditions**: `%24.resources%20%3F%20(%40.gpu_count%20%3E%202%20%26%26%20%40.memory_gb%20%3E%3D%2016)`\n\
            \n#### Notes\n- JSONPath expressions are evaluated using PostgreSQL's\
            \ `@?` operator\n- The `$.` prefix is automatically added to root-level\
            \ field references if missing\n- String values in conditions must be enclosed\
            \ in double quotes\n- Use `&&` for AND operations and `||` for OR operations\n\
            - Regular expressions use `like_regex` with standard regex syntax\n- **Remember\
            \ to URL-encode the entire JSONPath expression when making HTTP requests**\n\
            \n            "
          title: Metadata
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 5
          title: Page Size
          type: integer
      - description: 'Sort the results by one or more fields. Use `+` for ascending
          and `-` for descending order.


          **Available fields:**

          - `application_run_id`

          - `application_version_id`

          - `organization_id`

          - `status`

          - `triggered_at`

          - `triggered_by`


          **Examples:**

          - `?sort=triggered_at` - Sort by creation time (ascending)

          - `?sort=-triggered_at` - Sort by creation time (descending)

          - `?sort=status&sort=-triggered_at` - Sort by status, then by time (descending)

          '
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'Sort the results by one or more fields. Use `+` for ascending
            and `-` for descending order.


            **Available fields:**

            - `application_run_id`

            - `application_version_id`

            - `organization_id`

            - `status`

            - `triggered_at`

            - `triggered_by`


            **Examples:**

            - `?sort=triggered_at` - Sort by creation time (ascending)

            - `?sort=-triggered_at` - Sort by creation time (descending)

            - `?sort=status&sort=-triggered_at` - Sort by status, then by time (descending)

            '
          title: Sort
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RunReadResponse'
                title: Response List Application Runs V1 Runs Get
                type: array
          description: Successful Response
        '404':
          description: Application run not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: List Application Runs
      tags:
      - Public
    post:
      description: "This endpoint initiates a processing run for a selected application\
        \ version and returns an `application_run_id` for tracking purposes.\n\nSlide\
        \ processing occurs asynchronously, allowing you to retrieve results for individual\
        \ slides as soon as they\ncomplete processing. The system typically processes\
        \ slides in batches of four, though this number may be reduced\nduring periods\
        \ of high demand.\nBelow is an example of the required payload for initiating\
        \ an Atlas H&E TME processing run.\n\n\n### Payload\n\nThe payload includes\
        \ `application_version_id` and `items` base fields.\n\n`application_version_id`\
        \ is the id used for `/v1/versions/{application_id}` endpoint.\n\n`items`\
        \ includes the list of the items to process (slides, in case of HETA application).\n\
        Every item has a set of standard fields defined by the API, plus the metadata,\
        \ specific to the\nchosen application.\n\nExample payload structure with the\
        \ comments:\n```\n{\n    application_version_id: \"he-tme:v1.0.0-beta\",\n\
        \    items: [{\n        \"reference\": \"slide_1\",\n        \"input_artifacts\"\
        : [{\n            \"name\": \"user_slide\",\n            \"download_url\"\
        : \"https://...\",\n            \"metadata\": {\n                \"specimen\"\
        : {\n                  \"disease\": \"LUNG_CANCER\",\n                  \"\
        tissue\": \"LUNG\"\n                },\n                \"staining_method\"\
        : \"H&E\",\n                \"width_px\": 136223,\n                \"height_px\"\
        : 87761,\n                \"resolution_mpp\": 0.2628238,\n               \
        \ \"media-type\":\"image/tiff\",\n                \"checksum_base64_crc32c\"\
        : \"64RKKA==\"\n            }\n        }]\n    }]\n}\n```\n\n| Parameter \
        \ | Description |\n| :---- | :---- |\n| `application_version_id` required\
        \ | Unique ID for the application (must include version) |\n| `items` required\
        \ | List of submitted items (WSIs) with parameters described below. |\n| `reference`\
        \ required | Unique WSI name or ID for easy reference to results, provided\
        \ by the caller. The reference should be unique across all items of the application\
        \ run.  |\n| `input_artifacts` required | List of provided artifacts for a\
        \ WSI; at the moment Atlas H&E-TME receives only 1 artifact per slide (the\
        \ slide itself), but for some other applications this can be a slide and an\
        \ segmentation map  |\n| `name` required | Type of artifact; Atlas H&E-TME\
        \ supports only `\"input_slide\"` |\n| `download_url` required | Signed URL\
        \ to the input file in the S3 or GCS; Should be valid for at least 6 days\
        \ |\n| `specimen: disease` required | Supported cancer types for Atlas H&E-TME\
        \ (see full list in Atlas H&E-TME manual) |\n| `specimen: tissue` required\
        \ | Supported tissue types for Atlas H&E-TME (see full list in Atlas H&E-TME\
        \ manual) |\n| `staining_method` required | WSI stain /bio-marker; Atlas H&E-TME\
        \ supports only `\"H&E\"` |\n| `width_px` required | Integer value. Number\
        \ of pixels of the WSI in the X dimension. |\n| `height_px` required | Integer\
        \ value. Number of pixels of the WSI in the Y dimension. |\n| `resolution_mpp`\
        \ required | Resolution of WSI in micrometers per pixel; check allowed range\
        \ in Atlas H&E-TME manual |\n| `media-type` required | Supported media formats;\
        \ available values are: image/tiff  (for .tiff or .tif WSI) application/dicom\
        \ (for DICOM ) application/zip (for zipped DICOM) application/octet-stream\
        \  (for .svs WSI) |\n| `checksum_base64_crc32c` required | Base64 encoded\
        \ big-endian CRC32C checksum of the WSI image |\n\n\n\n### Response\n\nThe\
        \ endpoint returns the application run UUID. After that the job is scheduled\
        \ for the\nexecution in the background.\n\nTo check the status of the run\
        \ call `v1/runs/{application_run_id}`.\n\n### Rejection\n\nApart from the\
        \ authentication, authorization and malformed input error, the request can\
        \ be\nrejected when the quota limit is exceeded. More details on quotas is\
        \ described in the\ndocumentation"
      operationId: create_application_run_v1_runs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCreationResponse'
          description: Successful Response
        '400':
          description: Bad Request - Input validation failed
        '403':
          description: Forbidden - You don't have permission to create this run
        '404':
          description: Application version not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: Initiate Application Run
      tags:
      - Public
  /v1/runs/{application_run_id}:
    get:
      description: "This endpoint allows the caller to retrieve the current status\
        \ of an application run along with other relevant run details.\n A run becomes\
        \ available immediately after it is created through the POST `/runs/` endpoint.\n\
        \n To download the output results, use GET `/runs/{application_run_id}/` results\
        \ to get outputs for all slides.\nAccess to a run is restricted to the user\
        \ who created it."
      operationId: get_run_v1_runs__application_run_id__get
      parameters:
      - description: Application run id, returned by `POST /runs/` endpoint
        in: path
        name: application_run_id
        required: true
        schema:
          description: Application run id, returned by `POST /runs/` endpoint
          format: uuid
          title: Application Run Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunReadResponse'
          description: Successful Response
        '403':
          description: Forbidden - You don't have permission to see this run
        '404':
          description: Application run not found because it was deleted.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: Get run details
      tags:
      - Public
  /v1/runs/{application_run_id}/cancel:
    post:
      description: 'The application run can be canceled by the user who created 
the
        application run.


        The execution can be canceled any time while the application is not in a
final
        state. The

        pending items will not be processed and will not add to the cost.


        When the application is canceled, the already completed items stay 
available
        for download.'
      operationId: 
cancel_application_run_v1_runs__application_run_id__cancel_post
      parameters:
      - description: Application run id, returned by `POST /runs/` endpoint
        in: path
        name: application_run_id
        required: true
        schema:
          description: Application run id, returned by `POST /runs/` endpoint
          format: uuid
          title: Application Run Id
          type: string
      responses:
        '202':
          description: Run cancelled successfully
        '403':
          description: Forbidden - You don't have permission to cancel this run
        '404':
          description: Run not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: Cancel Application Run
      tags:
      - Public
  /v1/runs/{application_run_id}/results:
    delete:
      description: "This endpoint allows the caller to explicitly delete outputs generated\
        \ by an application.\nIt can only be invoked when the application run has\
        \ reached a final state\n(COMPLETED, COMPLETED_WITH_ERROR, CANCELED_USER,\
        \ or CANCELED_SYSTEM).\nNote that by default, all outputs are automatically\
        \ deleted 30 days after the application run finishes,\n regardless of whether\
        \ the caller explicitly requests deletion."
      operationId: delete_application_run_results_v1_runs__application_run_id__results_delete
      parameters:
      - description: Application run id, returned by `POST /runs/` endpoint
        in: path
        name: application_run_id
        required: true
        schema:
          description: Application run id, returned by `POST /runs/` endpoint
          format: uuid
          title: Application Run Id
          type: string
      responses:
        '204':
          description: All application outputs successfully deleted
        '404':
          description: Application run not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: Delete Application Run Results
      tags:
      - Public
    get:
      description: 'List results for items in an application run with filtering, sorting,
        and pagination capabilities.


        Returns paginated results for items within a specific application run. Results
        can be filtered

        by item IDs, references, status, and custom metadata using JSONPath expressions.


        ## JSONPath Metadata Filtering

        Use PostgreSQL JSONPath expressions to filter results by their metadata.


        ### Examples:

        - **Field existence**: `$.case_id` - Results that have a case_id field defined

        - **Exact value match**: `$.priority ? (@ == "high")` - Results with high
        priority

        - **Numeric comparison**: `$.confidence_score ? (@ > 0.95)` - Results with
        high confidence

        - **Array operations**: `$.flags[*] ? (@ == "reviewed")` - Results flagged
        as reviewed

        - **Complex conditions**: `$.metrics ? (@.accuracy > 0.9 && @.recall > 0.8)`
        - Results meeting performance thresholds


        ## Notes

        - JSONPath expressions are evaluated using PostgreSQL''s `@?` operator

        - The `$.` prefix is automatically added to root-level field references if
        missing

        - String values in conditions must be enclosed in double quotes

        - Use `&&` for AND operations and `||` for OR operations'
      operationId: list_run_results_v1_runs__application_run_id__results_get
      parameters:
      - description: Application run id, returned by `POST /runs/` endpoint
        in: path
        name: application_run_id
        required: true
        schema:
          description: Application run id, returned by `POST /runs/` endpoint
          format: uuid
          title: Application Run Id
          type: string
      - description: Filter for items ids
        in: query
        name: item_id__in
        required: false
        schema:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          description: Filter for items ids
          title: Item Id  In
      - description: Filter for items by their reference from the input payload
        in: query
        name: reference__in
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter for items by their reference from the input 
payload
          title: Reference  In
      - description: Filter for items in certain statuses
        in: query
        name: status__in
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/ItemStatus'
            type: array
          - type: 'null'
          description: Filter for items in certain statuses
          title: Status  In
      - description: JSONPath expression to filter results by their metadata
        examples:
          array_operations:
            description: Check if an array contains a certain value
            summary: Check if an array contains a certain value
            value: $.tags[*] ? (@ == "production")
          complex_filters:
            description: Combine multiple checks
            summary: Combine multiple checks
            value: $.resources ? (@.gpu_count > 2 && @.memory_gb >= 16)
          field_exists:
            description: Find results that have a project field defined
            summary: Check if field exists
            value: $.project
          field_has_value:
            description: Compare a field value against a certain value
            summary: Check if field has a certain value
            value: $.project ? (@ == "cancer-research")
          numeric_comparisons:
            description: Compare a field value against a numeric value of a field
            summary: Compare to a numeric value of a field
            value: $.duration_hours ? (@ < 2)
        in: query
        name: metadata
        required: false
        schema:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: JSONPath expression to filter results by their metadata
          title: Metadata
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 5
          title: Page Size
          type: integer
      - description: "Sort the results by one or more fields. Use `+` for ascending\
          \ and `-` for descending order.\n                **Available fields:**\n\
          - `item_id`\n- `application_run_id`\n- `reference`\n- `status`\n- `metadata`\n\
          \n**Examples:**\n- `?sort=item_id` - Sort by id of the item (ascending)\n\
          - `?sort=-application_run_id` - Sort by id of the run (descending)\n- `?sort=status&sort=-item_idt`\
          \ - Sort by status, then by id of the item (descending)"
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: "Sort the results by one or more fields. Use `+` for ascending\
            \ and `-` for descending order.\n                **Available fields:**\n\
            - `item_id`\n- `application_run_id`\n- `reference`\n- `status`\n- `metadata`\n\
            \n**Examples:**\n- `?sort=item_id` - Sort by id of the item (ascending)\n\
            - `?sort=-application_run_id` - Sort by id of the run (descending)\n-\
            \ `?sort=status&sort=-item_idt` - Sort by status, then by id of the item\
            \ (descending)"
          title: Sort
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ItemResultReadResponse'
                title: Response List Run Results V1 Runs  Application Run Id  
Results
                  Get
                type: array
          description: Successful Response
        '404':
          description: Application run not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2AuthorizationCodeBearer: []
      summary: List Run Results
      tags:
      - Public
