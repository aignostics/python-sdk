components:
  schemas:
    ApplicationReadResponse:
      description: Response schema for `List available applications` and `Read Application
        by Id` endpoints
      properties:
        application_id:
          description: Application ID
          examples:
          - he-tme
          title: Application Id
          type: string
        description:
          description: 'Describing what the application can do '
          examples:
          - The Atlas H&E TME is an AI application designed to examine FFPE (formalin-fixed,
            paraffin-embedded) tissues stained with H&E (hematoxylin and eosin), delivering
            comprehensive insights into the tumor microenvironment.
          title: Description
          type: string
        name:
          description: Application display name
          examples:
          - Atlas H&E-TME
          title: Name
          type: string
        regulatory_classes:
          description: 'Regulatory classes, to which the applications comply with.
            Possible values include: RUO, IVDR, FDA.'
          examples:
          - - RUO
          items:
            type: string
          title: Regulatory Classes
          type: array
      required:
      - application_id
      - name
      - regulatory_classes
      - description
      title: ApplicationReadResponse
      type: object
    ApplicationRunStatus:
      enum:
      - CANCELED_SYSTEM
      - CANCELED_USER
      - COMPLETED
      - COMPLETED_WITH_ERROR
      - RECEIVED
      - REJECTED
      - RUNNING
      - SCHEDULED
      title: ApplicationRunStatus
      type: string
    ApplicationVersionReadResponse:
      description: Response schema for `List Available Application Versions` endpoint
      properties:
        application_id:
          description: Application ID
          title: Application Id
          type: string
        application_version_id:
          description: Application version ID
          examples:
          - he-tme:v0.0.1
          title: Application Version Id
          type: string
        changelog:
          description: Description of the changes relative to the previous 
version
          title: Changelog
          type: string
        created_at:
          description: The timestamp when the application version was registered
          format: date-time
          title: Created At
          type: string
        flow_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Flow ID, used internally by the platform
          title: Flow Id
        input_artifacts:
          description: Lists required input fields, that should be provided by the
            caller
          items:
            $ref: '#/components/schemas/InputArtifactReadResponse'
          title: Input Artifacts
          type: array
        output_artifacts:
          description: Lists the structure of the output artifacts generated by the
            application
          items:
            $ref: '#/components/schemas/OutputArtifactReadResponse'
          title: Output Artifacts
          type: array
        version:
          description: Semantic version of the application
          examples:
          - 0.0.1
          title: Version
          type: string
      required:
      - application_version_id
      - version
      - application_id
      - changelog
      - input_artifacts
      - output_artifacts
      - created_at
      title: ApplicationVersionReadResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InputArtifact:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - image/tiff
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - mime_type
      - metadata_schema
      title: InputArtifact
      type: object
    InputArtifactCreationRequest:
      description: Input artifact containing the slide image and associated metadata.
      properties:
        download_url:
          description: '[Signed 
URL](https://cloud.google.com/cdn/docs/using-signed-urls)
            to the input artifact file. The URL should be valid for at least 6 
days
            from the payload submission time.'
          examples:
          - https://example.com/case-no-1-slide.tiff
          format: uri
          maxLength: 2083
          minLength: 1
          title: Download Url
          type: string
        metadata:
          description: The metadata of the artifact, required by the application
version.
            The JSON schema of the metadata can be requested by 
`/v1/versions/{application_version_id}`.
            The schema is located in `input_artifacts.[].metadata_schema`
          examples:
          - checksum_base64_crc32c: 752f9554
            height: 2000
            height_mpp: 0.5
            width: 10000
            width_mpp: 0.5
          title: Metadata
          type: object
        name:
          description: Type of artifact. For Atlas H&E-TME, use "input_slide"
          examples:
          - input_slide
          title: Name
          type: string
      required:
      - name
      - download_url
      - metadata
      title: InputArtifactCreationRequest
      type: object
    InputArtifactReadResponse:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - image/tiff
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - mime_type
      - metadata_schema
      title: InputArtifactReadResponse
      type: object
    ItemCreationRequest:
      description: Individual item (slide) to be processed in an application run.
      properties:
        input_artifacts:
          description: List of input artifacts for this item. For Atlas H&E-TME, typically
            contains one artifact (the slide image)
          examples:
          - - download_url: https://example-bucket.s3.amazonaws.com/slide1.tiff
              metadata:
                checksum_base64_crc32c: 64RKKA==
                height_px: 87761
                media-type: image/tiff
                resolution_mpp: 0.2628238
                specimen:
                  disease: LUNG_CANCER
                  tissue: LUNG
                staining_method: H&E
                width_px: 136223
              name: input_slide
          items:
            $ref: '#/components/schemas/InputArtifactCreationRequest'
          title: Input Artifacts
          type: array
        metadata:
          anyOf:
          - type: object
          - type: 'null'
          description: Optional JSON metadata to store additional information alongside
            an item.
          examples:
          - case: abc
          title: Metadata
        reference:
          description: Unique identifier for this item within the run. Used for referencing
            results. Must be unique across all items in the same application run
          examples:
          - slide_1
          - patient_001_slide_A
          - sample_12345
          title: Reference
          type: string
      required:
      - reference
      - input_artifacts
      title: ItemCreationRequest
      type: object
    ItemReadResponse:
      description: Response schema for `Get Item` endpoint
      properties:
        application_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          title: Application Run Id
        item_id:
          format: uuid
          title: Item Id
          type: string
        message:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Processing started
          title: Message
        reference:
          examples:
          - sample-123
          title: Reference
          type: string
        status:
          $ref: '#/components/schemas/ItemStatus'
        terminated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Timestamp showing when the item reached a terminal state.
          examples:
          - '2024-01-15T10:30:45.123Z'
          title: Terminated At
      required:
      - item_id
      - reference
      - status
      title: ItemReadResponse
      type: object
    ItemResultReadResponse:
      description: Response schema for items in `List Run Results` endpoint
      properties:
        application_run_id:
          description: Application run UUID to which the item belongs
          format: uuid
          title: Application Run Id
          type: string
        error:
          anyOf:
          - type: string
          - type: 'null'
          deprecated: true
          description: "\n    The error message in case the item is in `error_system`\
            \ or `error_user` state\n        "
          title: Error
        item_id:
          description: Item UUID generated by the Platform
          format: uuid
          title: Item Id
          type: string
        message:
          anyOf:
          - type: string
          - type: 'null'
          description: "\nThe error message in case the item is in `error_system`\
            \ or `error_user` state\n    "
          examples:
          - This item was not processed because the threshold of 3 items finishing
            in error state (user or system error) was reached before the item was
            processed.
          - 'The item was not processed because the run was cancelled by the user
            before the item was processed.User error raised by Application because
            the input data provided by the user cannot be processed:

            The image width is 123000 px, but the maximum width is 100000 px'
          - "A system error occurred during the item execution:\n System went out\
            \ of memory in cell classification"
          - An unknown system error occurred during the item execution
          title: Message
        metadata:
          anyOf:
          - type: object
          - type: 'null'
          description: The metadata of the item that has been provided by the user
            on application run creation.
          title: Metadata
        output_artifacts:
          description: "\nThe list of the results generated by the application 
algorithm.\
            \ The number of files and their\ntypes depend on the particular 
application\
            \ version, call `/v1/versions/{version_id}` to get\nthe details.\n  
"
          items:
            $ref: '#/components/schemas/OutputArtifactResultReadResponse'
          title: Output Artifacts
          type: array
        reference:
          description: The reference of the item from the user payload
          examples:
          - slide_1
          title: Reference
          type: string
        status:
          $ref: '#/components/schemas/ItemStatus'
          description: "\nWhen the item is not processed yet, the status is set 
to\
            \ `pending`.\n\nWhen the item is successfully finished, status is 
set\
            \ to `succeeded`, and the processing results\nbecome available for 
download\
            \ in `output_artifacts` field.\n\nWhen the item processing is failed
because\
            \ the provided item is invalid, the status is set to\n`error_user`. 
When\
            \ the item processing failed because of the error in the model or 
platform,\n\
            the status is set to `error_system`. When the application_run is 
canceled,\
            \ the status of all\npending items is set to either `cancelled_user`
or\
            \ `cancelled_system`.\n    "
        terminated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Timestamp showing when the item reached a terminal state.
          examples:
          - '2024-01-15T10:30:45.123Z'
          title: Terminated At
      required:
      - item_id
      - application_run_id
      - reference
      - metadata
      - status
      - message
      - output_artifacts
      title: ItemResultReadResponse
      type: object
    ItemStatus:
      enum:
      - PENDING
      - CANCELED_USER
      - CANCELED_SYSTEM
      - ERROR_USER
      - ERROR_SYSTEM
      - SUCCEEDED
      title: ItemStatus
      type: string
    MeReadResponse:
      description: Response schema for `Get current user` endpoint
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationReadResponse'
        user:
          $ref: '#/components/schemas/UserReadResponse'
      required:
      - user
      - organization
      title: MeReadResponse
      type: object
    OrganizationReadResponse:
      description: 'Part of response schema for Organization object in `Get current
        user` endpoint.

        This model corresponds to the response schema returned from

        Auth0 GET /v2/organizations/{id} endpoint, flattens out the metadata out

        and doesn''t return branding or token_quota objects.

        For details, see:

        https://auth0.com/docs/api/management/v2/organizations/get-organizations-by-id


        #### Configuration for integrating with Aignostics Platform services.


        The Aignostics Platform API requires signed URLs for input artifacts (slide
        images). To simplify this process,

        Aignostics provides a dedicated storage bucket. The HMAC credentials below
        grant read and write

        access to this bucket, allowing you to upload files and generate the signed
        URLs needed for API calls.


        Additionally, logging and error reporting tokens enable Aignostics to provide
        better support and monitor

        system performance for your integration.'
      properties:
        aignostics_bucket_hmac_access_key_id:
          description: HMAC access key ID for the Aignostics-provided storage bucket.
            Used to authenticate requests for uploading files and generating signed
            URLs
          examples:
          - AKIAIOSFODNN7EXAMPLE
          title: Aignostics Bucket Hmac Access Key Id
          type: string
        aignostics_bucket_hmac_secret_access_key:
          description: HMAC secret access key paired with the access key ID. Keep
            this credential secure.
          examples:
          - wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          title: Aignostics Bucket Hmac Secret Access Key
          type: string
        aignostics_bucket_name:
          description: Name of the bucket provided by Aignostics for storing input
            artifacts (slide images)
          examples:
          - aignostics-platform-bucket
          title: Aignostics Bucket Name
          type: string
        aignostics_bucket_protocol:
          description: Protocol to use for bucket access. Defines the URL scheme for
            connecting to the storage service
          examples:
          - gs
          title: Aignostics Bucket Protocol
          type: string
        aignostics_logfire_token:
          description: Authentication token for Logfire observability service. Enables
            sending application logs and performance metrics to Aignostics for monitoring
            and support
          examples:
          - your-logfire-token
          title: Aignostics Logfire Token
          type: string
        aignostics_sentry_dsn:
          description: Data Source Name (DSN) for Sentry error tracking service. Allows
            automatic reporting of errors and exceptions to Aignostics support team
          examples:
          - https://2354s3#ewsha@o44.ingest.us.sentry.io/34345123432
          title: Aignostics Sentry Dsn
          type: string
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          description: "Public organization name (E.g. \u201CAignostics GmbH\u201D\
            )"
          examples:
          - Aignostics GmbH
          title: Display Name
        id:
          description: Unique organization identifier
          examples:
          - org_123456
          title: Id
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: "Organization name (E.g. \u201Caignx\u201D)"
          examples:
          - aignx
          title: Name
      required:
      - id
      - aignostics_bucket_hmac_access_key_id
      - aignostics_bucket_hmac_secret_access_key
      - aignostics_bucket_name
      - aignostics_bucket_protocol
      - aignostics_logfire_token
      - aignostics_sentry_dsn
      title: OrganizationReadResponse
      type: object
    OutputArtifact:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - application/vnd.apache.parquet
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
        scope:
          $ref: '#/components/schemas/OutputArtifactScope'
        visibility:
          $ref: '#/components/schemas/OutputArtifactVisibility'
      required:
      - name
      - mime_type
      - metadata_schema
      - scope
      - visibility
      title: OutputArtifact
      type: object
    OutputArtifactReadResponse:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - application/vnd.apache.parquet
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
        scope:
          $ref: '#/components/schemas/OutputArtifactScope'
      required:
      - name
      - mime_type
      - metadata_schema
      - scope
      title: OutputArtifactReadResponse
      type: object
    OutputArtifactResultReadResponse:
      properties:
        download_url:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          description: "\nThe download URL to the output file. The URL is valid 
for\
            \ 1 hour after the endpoint is called.\nA new URL is generated every
time\
            \ the endpoint is called.\n    "
          title: Download Url
        metadata:
          description: The metadata of the output artifact, provided by the 
application
          title: Metadata
          type: object
        name:
          description: "\nName of the output from the output schema from the 
`/v1/versions/{version_id}`\
            \ endpoint.\n    "
          examples:
          - tissue_qc:tiff_heatmap
          title: Name
          type: string
        output_artifact_id:
          description: The Id of the artifact. Used internally
          format: uuid
          title: Output Artifact Id
          type: string
      required:
      - output_artifact_id
      - name
      - metadata
      - download_url
      title: OutputArtifactResultReadResponse
      type: object
    OutputArtifactScope:
      enum:
      - ITEM
      - GLOBAL
      title: OutputArtifactScope
      type: string
    OutputArtifactVisibility:
      enum:
      - INTERNAL
      - EXTERNAL
      title: OutputArtifactVisibility
      type: string
    PayloadInputArtifact:
      properties:
        download_url:
          format: uri
          minLength: 1
          title: Download Url
          type: string
        input_artifact_id:
          format: uuid
          title: Input Artifact Id
          type: string
        metadata:
          title: Metadata
          type: object
      required:
      - metadata
      - download_url
      title: PayloadInputArtifact
      type: object
    PayloadItem:
      properties:
        input_artifacts:
          additionalProperties:
            $ref: '#/components/schemas/PayloadInputArtifact'
          title: Input Artifacts
          type: object
        item_id:
          format: uuid
          title: Item Id
          type: string
        output_artifacts:
          additionalProperties:
            $ref: '#/components/schemas/PayloadOutputArtifact'
          title: Output Artifacts
          type: object
      required:
      - item_id
      - input_artifacts
      - output_artifacts
      title: PayloadItem
      type: object
    PayloadOutputArtifact:
      properties:
        data:
          $ref: '#/components/schemas/TransferUrls'
        metadata:
          $ref: '#/components/schemas/TransferUrls'
        output_artifact_id:
          format: uuid
          title: Output Artifact Id
          type: string
      required:
      - output_artifact_id
      - data
      - metadata
      title: PayloadOutputArtifact
      type: object
    RunCreationRequest:
      description: 'Request schema for `Initiate Application Run` endpoint.

        It describes which application version is chosen, and which user data should
        be processed.'
      properties:
        application_version_id:
          description: Unique ID for the application version to use for processing.
            Must include version suffix (e.g., 'he-tme:v1.0.0-beta')
          examples:
          - he-tme:v1.0.0-beta
          title: Application Version Id
          type: string
        items:
          description: List of items (slides) to process. Each item represents a whole
            slide image (WSI) with its associated metadata and artifacts
          examples:
          - - input_artifacts:
              - download_url: https://example-bucket.s3.amazonaws.com/slide1.tiff?signature=...
                metadata:
                  checksum_base64_crc32c: 64RKKA==
                  height_px: 87761
                  media-type: image/tiff
                  resolution_mpp: 0.2628238
                  specimen:
                    disease: LUNG_CANCER
                    tissue: LUNG
                  staining_method: H&E
                  width_px: 136223
                name: input_slide
              reference: slide_1
          items:
            $ref: '#/components/schemas/ItemCreationRequest'
          minItems: 1
          title: Items
          type: array
        metadata:
          anyOf:
          - type: object
          - type: 'null'
          description: Optional JSON metadata to store additional information alongside
            the application run
          examples:
          - department: D1
            study: abc-1
          title: Metadata
      required:
      - application_version_id
      - items
      title: RunCreationRequest
      type: object
    RunCreationResponse:
      properties:
        application_run_id:
          default: Application run id
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          title: Application Run Id
          type: string
      title: RunCreationResponse
      type: object
    RunReadResponse:
      description: Response schema for `Get run details` endpoint
      properties:
        application_run_id:
          description: UUID of the application
          format: uuid
          title: Application Run Id
          type: string
        application_version_id:
          description: ID of the application version
          examples:
          - he-tme:v0.4.4
          title: Application Version Id
          type: string
        message:
          anyOf:
          - type: string
          - type: 'null'
          description: The description of the run error
          examples:
          - The run was cancelled because the threshold of 3 items finishing in error
            state was reached. Query /runs/{run_id}/results to get the error message
            per item.
          - The run was cancelled because one item finished in error state despite
            2 retries. Query /runs/{run_id}/results to get the error message per item.
          - The run is cancelled by the user. Query /runs/{run_id}/results to get
            the items processed before the cancellation.
          title: Message
        metadata:
          anyOf:
          - type: object
          - type: 'null'
          description: Optional JSON metadata that was stored in alongside the application
            run by the user
          examples:
          - department: D1
            study: abc-1
          title: Metadata
        organization_id:
          description: Organization of the owner of the application run
          examples:
          - org-123
          title: Organization Id
          type: string
        status:
          $ref: '#/components/schemas/ApplicationRunStatus'
          description: "When the application run request is received by the Platform,\
            \ the `status` of it is set to\n`running`. When the application run is\
            \ scheduled, the input items will be processed and the result will\nbe\
            \ generated incrementally. The results can be downloaded via `/v1/runs/{run_id}/results`\
            \ endpoint.\nWhen all items are processed and all results are generated,\
            \ the application status is set to\n`completed`. If the processing is\
            \ done, but some items fail, the status is set to\n`completed_with_error`.\n\
            \nWhen the application run reaches the threshold of number of failed items,\
            \ the whole\napplication run is set to `canceled_system` and the remaining\
            \ pending items are not processed.\nWhen the application run fails, the\
            \ finished item results are available for download.\n\nIf the application\
            \ run is canceled by calling `POST /v1/runs/{run_id}/cancel` endpoint,\
            \ the\nprocessing of the items is stopped, and the application status\
            \ is set to `cancelled_user`\n    "
        terminated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Timestamp showing when the application run reached a terminal
            state.
          examples:
          - '2024-01-15T10:30:45.123Z'
          title: Terminated At
        triggered_at:
          description: Timestamp showing when the application run was triggered
          format: date-time
          title: Triggered At
          type: string
        triggered_by:
          description: Id of the user who triggered the application run
          examples:
          - auth0|123456
          title: Triggered By
          type: string
        user_payload:
          anyOf:
          - $ref: '#/components/schemas/UserPayload'
          - type: 'null'
          description: Field used internally by the Platform
      required:
      - application_run_id
      - application_version_id
      - organization_id
      - status
      - message
      - triggered_at
      - triggered_by
      title: RunReadResponse
      type: object
    TransferUrls:
      properties:
        download_url:
          format: uri
          minLength: 1
          title: Download Url
          type: string
        upload_url:
          format: uri
          minLength: 1
          title: Upload Url
          type: string
      required:
      - upload_url
      - download_url
      title: TransferUrls
      type: object
    UserPayload:
      properties:
        application_id:
          title: Application Id
          type: string
        application_run_id:
          format: uuid
          title: Application Run Id
          type: string
        global_output_artifacts:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PayloadOutputArtifact'
            type: object
          - type: 'null'
          title: Global Output Artifacts
        items:
          items:
            $ref: '#/components/schemas/PayloadItem'
          title: Items
          type: array
      required:
      - application_id
      - application_run_id
      - global_output_artifacts
      - items
      title: UserPayload
      type: object
    UserReadResponse:
      description: 'Part of response schema for User object in `Get current user`
        endpoint.

        This model corresponds to the response schema returned from

        Auth0 GET /v2/users/{id} endpoint.

        For details, see:

        https://auth0.com/docs/api/management/v2/users/get-users-by-id'
      properties:
        email:
          anyOf:
          - type: string
          - type: 'null'
          description: User email
          examples:
          - user@domain.com
          title: Email
        email_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          examples:
          - true
          title: Email Verified
        family_name:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Doe
          title: Family Name
        given_name:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Jane
          title: Given Name
        id:
          description: Unique user identifier
          examples:
          - auth0|123456
          title: Id
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: First and last name of the user
          examples:
          - Jane Doe
          title: Name
        nickname:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - jdoe
          title: Nickname
        picture:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - https://example.com/jdoe.jpg
          title: Picture
        updated_at:
