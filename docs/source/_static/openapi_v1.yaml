          - `application_version_id`

          - `organization_id`

          - `status`

          - `submitted_at`

          - `submitted_by`


          **Examples:**

          - `?sort=submitted_at` - Sort by creation time (ascending)

          - `?sort=-submitted_at` - Sort by creation time (descending)

          - `?sort=status&sort=-submitted_at` - Sort by status, then by time 
(descending)

          '
