components:
  schemas:
    ApplicationCreationRequest:
      properties:
        description:
          examples:
          - 'H&E Tumor Micro Environment Analysis: Performing tissue QC, 
segmentation,
            cell detection and cell classfication'
          title: Description
          type: string
        name:
          examples:
          - HETA
          title: Name
          type: string
        regulatory_classes:
          examples:
          - - RuO
          items:
            type: string
          title: Regulatory Classes
          type: array
      required:
      - name
      - description
      - regulatory_classes
      title: ApplicationCreationRequest
      type: object
    ApplicationCreationResponse:
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
      required:
      - application_id
      title: ApplicationCreationResponse
      type: object
    ApplicationReadResponse:
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
        description:
          examples:
          - Aignostics H&E TME application
          title: Description
          type: string
        name:
          examples:
          - HETA
          title: Name
          type: string
        regulatory_classes:
          examples:
          - - RuO
          items:
            type: string
          title: Regulatory Classes
          type: array
        slug:
          examples:
          - heta
          title: Slug
          type: string
      required:
      - application_id
      - name
      - slug
      - regulatory_classes
      - description
      title: ApplicationReadResponse
      type: object
    ApplicationRunStatus:
      enum:
      - canceled_system
      - canceled_user
      - completed
      - completed_with_error
      - received
      - rejected
      - running
      - scheduled
      title: ApplicationRunStatus
      type: string
    ApplicationVersionReadResponse:
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
        application_version_id:
          format: uuid
          title: Application Version Id
          type: string
        application_version_slug:
          examples:
          - tissue-segmentation-qc:v0.0.1
          pattern: ^(?:|-)*:v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
          title: Application Version Slug
          type: string
        changelog:
          title: Changelog
          type: string
        flow_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Flow Id
        input_artifacts:
          items:
            $ref: '#/components/schemas/InputArtifactReadResponse'
          title: Input Artifacts
          type: array
        output_artifacts:
          items:
            $ref: '#/components/schemas/OutputArtifactReadResponse'
          title: Output Artifacts
          type: array
        version:
          title: Version
          type: string
      required:
      - application_version_id
      - application_version_slug
      - version
      - application_id
      - changelog
      - input_artifacts
      - output_artifacts
      title: ApplicationVersionReadResponse
      type: object
    ArtifactEvent:
      description: 'This is a subset of the OutputArtifactEvent used by the 
state
        machine.

        Only the variants defined below are allowed to be submitted from the 
Algorithms/Applications.'
      enum:
      - succeeded
      - failed_with_user_error
      - failed_with_system_error
      title: ArtifactEvent
      type: string
    ArtifactStatus:
      enum:
      - pending
      - canceled_user
      - canceled_system
      - error_user
      - error_system_fatal
      - error_system_recoverable
      - skipped
      - succeeded
      title: ArtifactStatus
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InputArtifact:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - image/tiff
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - mime_type
      - metadata_schema
      title: InputArtifact
      type: object
    InputArtifactCreationRequest:
      properties:
        download_url:
          examples:
          - https://example.com/case-no-1-slide.tiff
          format: uri
          maxLength: 2083
          minLength: 1
          title: Download Url
          type: string
        metadata:
          examples:
          - checksum_crc32c: 752f9554
            height: 2000
            height_mpp: 0.5
            width: 10000
            width_mpp: 0.5
          title: Metadata
          type: object
        name:
          examples:
          - slide
          title: Name
          type: string
      required:
      - name
      - download_url
      - metadata
      title: InputArtifactCreationRequest
      type: object
    InputArtifactReadResponse:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - image/tiff
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - mime_type
      - metadata_schema
      title: InputArtifactReadResponse
      type: object
    InputArtifactSchemaCreationRequest:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - application/vnd.apache.parquet
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - mime_type
      - metadata_schema
      title: InputArtifactSchemaCreationRequest
      type: object
    ItemCreationRequest:
      properties:
        input_artifacts:
          items:
            $ref: '#/components/schemas/InputArtifactCreationRequest'
          title: Input Artifacts
          type: array
        reference:
          examples:
          - case-no-1
          title: Reference
          type: string
      required:
      - reference
      - input_artifacts
      title: ItemCreationRequest
      type: object
    ItemEvent:
      enum:
      - failed_with_system_error
      - failed_recoverable
      title: ItemEvent
      type: string
    ItemEventCreationRequest:
      properties:
        error:
          title: Error
          type: string
        event:
          $ref: '#/components/schemas/ItemEvent'
      required:
      - event
      - error
      title: ItemEventCreationRequest
      type: object
    ItemEventCreationResponse:
      properties:
        item_id:
          format: uuid
          title: Item Id
          type: string
        status:
          $ref: '#/components/schemas/ItemStatus'
      required:
      - item_id
      - status
      title: ItemEventCreationResponse
      type: object
    ItemReadResponse:
      properties:
        application_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Application Run Id
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        item_id:
          format: uuid
          title: Item Id
          type: string
        reference:
          title: Reference
          type: string
        status:
          $ref: '#/components/schemas/ItemStatus'
      required:
      - item_id
      - reference
      - status
      - error
      title: ItemReadResponse
      type: object
    ItemResultReadResponse:
      properties:
        application_run_id:
          format: uuid
          title: Application Run Id
          type: string
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        item_id:
          format: uuid
          title: Item Id
          type: string
        output_artifacts:
          items:
            $ref: '#/components/schemas/OutputArtifactResultReadResponse'
          title: Output Artifacts
          type: array
        reference:
          title: Reference
          type: string
        status:
          $ref: '#/components/schemas/ItemStatus'
      required:
      - item_id
      - application_run_id
      - reference
      - status
      - error
      - output_artifacts
      title: ItemResultReadResponse
      type: object
    ItemStatus:
      enum:
      - pending
      - canceled_user
      - canceled_system
      - error_user
      - error_system
      - succeeded
      title: ItemStatus
      type: string
    OrganizationCreationRequest:
      properties:
        batch_size:
          title: Batch Size
          type: integer
        organization_id:
          title: Organization Id
          type: string
        owner_email:
          title: Owner Email
          type: string
        slide_quota:
          title: Slide Quota
          type: integer
      required:
      - organization_id
      - owner_email
      - slide_quota
      - batch_size
      title: OrganizationCreationRequest
      type: object
    OrganizationQuota:
      properties:
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
        used:
          title: Used
          type: integer
      required:
      - total
      - used
      title: OrganizationQuota
      type: object
    OrganizationResponse:
      properties:
        batch_size:
          title: Batch Size
          type: integer
        organization_id:
          title: Organization Id
          type: string
        owner_id:
          format: uuid
          title: Owner Id
          type: string
        slide_quota:
          $ref: '#/components/schemas/OrganizationQuota'
      required:
      - organization_id
      - owner_id
      - slide_quota
      - batch_size
      title: OrganizationResponse
      type: object
    OrganizationUpdateRequest:
      properties:
        batch_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Batch Size
        slide_quota:
          anyOf:
          - type: integer
          - type: 'null'
          title: Slide Quota
      title: OrganizationUpdateRequest
      type: object
    OutputArtifact:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - application/vnd.apache.parquet
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
        scope:
          $ref: '#/components/schemas/OutputArtifactScope'
        visibility:
          $ref: '#/components/schemas/OutputArtifactVisibility'
      required:
      - name
      - mime_type
      - metadata_schema
      - scope
      - visibility
      title: OutputArtifact
      type: object
    OutputArtifactEventTriggerRequest:
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        event:
          $ref: '#/components/schemas/ArtifactEvent'
        metadata:
          title: Metadata
          type: object
      required:
      - event
      - metadata
      title: OutputArtifactEventTriggerRequest
      type: object
    OutputArtifactEventTriggerResponse:
      properties:
        output_artifact_id:
          format: uuid
          title: Output Artifact Id
          type: string
        status:
          $ref: '#/components/schemas/ArtifactStatus'
      required:
      - output_artifact_id
      - status
      title: OutputArtifactEventTriggerResponse
      type: object
    OutputArtifactReadResponse:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - application/vnd.apache.parquet
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
        scope:
          $ref: '#/components/schemas/OutputArtifactScope'
      required:
      - name
      - mime_type
      - metadata_schema
      - scope
      title: OutputArtifactReadResponse
      type: object
    OutputArtifactResultReadResponse:
      properties:
        download_url:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          title: Download Url
        metadata:
          title: Metadata
          type: object
        mime_type:
          examples:
          - application/vnd.apache.parquet
          pattern: ^\w+\/\w+[-+.|\w+]+\w+$
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
        output_artifact_id:
          format: uuid
          title: Output Artifact Id
          type: string
      required:
      - output_artifact_id
      - name
      - mime_type
      - metadata
      - download_url
      title: OutputArtifactResultReadResponse
      type: object
    OutputArtifactSchemaCreationRequest:
      properties:
        metadata_schema:
          title: Metadata Schema
          type: object
        mime_type:
          examples:
          - application/vnd.apache.parquet
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
        scope:
          $ref: '#/components/schemas/OutputArtifactScope'
        visibility:
          $ref: '#/components/schemas/OutputArtifactVisibility'
      required:
      - name
      - mime_type
      - scope
      - visibility
      - metadata_schema
      title: OutputArtifactSchemaCreationRequest
      type: object
    OutputArtifactScope:
      enum:
      - item
      - global
      title: OutputArtifactScope
      type: string
    OutputArtifactVisibility:
      enum:
      - internal
      - external
      title: OutputArtifactVisibility
      type: string
    PayloadInputArtifact:
      properties:
        download_url:
          format: uri
          minLength: 1
          title: Download Url
          type: string
        input_artifact_id:
          format: uuid
          title: Input Artifact Id
          type: string
        metadata:
          title: Metadata
          type: object
      required:
      - input_artifact_id
      - metadata
      - download_url
      title: PayloadInputArtifact
      type: object
    PayloadItem:
      properties:
        input_artifacts:
          additionalProperties:
            $ref: '#/components/schemas/PayloadInputArtifact'
          title: Input Artifacts
          type: object
        item_id:
          format: uuid
          title: Item Id
          type: string
        output_artifacts:
          additionalProperties:
            $ref: '#/components/schemas/PayloadOutputArtifact'
          title: Output Artifacts
          type: object
      required:
      - item_id
      - input_artifacts
      - output_artifacts
      title: PayloadItem
      type: object
    PayloadOutputArtifact:
      properties:
        data:
          $ref: '#/components/schemas/TransferUrls'
        metadata:
          $ref: '#/components/schemas/TransferUrls'
        output_artifact_id:
          format: uuid
          title: Output Artifact Id
          type: string
      required:
      - output_artifact_id
      - data
      - metadata
      title: PayloadOutputArtifact
      type: object
    QuotaName:
      description: Global, API-level, and slide-level quotas for Samia API.
      enum:
      - max_users
      - max_organizations
      - max_users_per_organization
      - max_applications
      - max_application_versions
      - max_slides_per_run
      - max_parallel_runs
      - max_parallel_runs_per_organization
      - max_parallel_runs_per_user
      title: QuotaName
      type: string
    QuotaReadResponse:
      description: GET response payload for quota read.
      properties:
        name:
          $ref: '#/components/schemas/QuotaName'
        quota:
          title: Quota
          type: integer
      required:
      - name
      - quota
      title: QuotaReadResponse
      type: object
    QuotaUpdateRequest:
      description: PATCH request payload for quota update.
      properties:
        name:
          $ref: '#/components/schemas/QuotaName'
        quota:
          exclusiveMinimum: 0.0
          title: Quota
          type: integer
      required:
      - name
      - quota
      title: QuotaUpdateRequest
      type: object
    QuotaUpdateResponse:
      description: PATCH response payload for quota update.
      properties:
        name:
          $ref: '#/components/schemas/QuotaName'
        quota:
          title: Quota
          type: integer
      required:
      - name
      - quota
      title: QuotaUpdateResponse
      type: object
    QuotasReadResponse:
      description: GET response payload for multiple quota reads.
      properties:
        quotas:
          items:
            $ref: '#/components/schemas/QuotaReadResponse'
          title: Quotas
          type: array
      required:
      - quotas
      title: QuotasReadResponse
      type: object
    QuotasUpdateRequest:
      description: PATCH request payload for quota updates.
      properties:
        quotas:
          items:
            $ref: '#/components/schemas/QuotaUpdateRequest'
          title: Quotas
          type: array
      required:
      - quotas
      title: QuotasUpdateRequest
      type: object
    QuotasUpdateResponse:
      description: PATCH response payload for quota updates.
      properties:
        updated_quotas:
          items:
            $ref: '#/components/schemas/QuotaUpdateResponse'
          title: Updated Quotas
          type: array
      required:
      - updated_quotas
      title: QuotasUpdateResponse
      type: object
    RunCreationRequest:
      properties:
        application_version:
          anyOf:
          - format: uuid
            type: string
          - $ref: '#/components/schemas/SlugVersionRequest'
          examples:
          - efbf9822-a1e5-4045-a283-dbf26e8064a9
          title: Application Version
        items:
          items:
            $ref: '#/components/schemas/ItemCreationRequest'
          title: Items
          type: array
      required:
      - application_version
      - items
      title: RunCreationRequest
      type: object
    RunCreationResponse:
      properties:
        application_run_id:
          format: uuid
          title: Application Run Id
          type: string
      required:
      - application_run_id
      title: RunCreationResponse
      type: object
    RunReadResponse:
      properties:
        application_run_id:
          format: uuid
          title: Application Run Id
          type: string
        application_version_id:
          format: uuid
          title: Application Version Id
          type: string
        organization_id:
          title: Organization Id
          type: string
        status:
          $ref: '#/components/schemas/ApplicationRunStatus'
        triggered_at:
          format: date-time
          title: Triggered At
          type: string
        triggered_by:
          title: Triggered By
          type: string
        user_payload:
          anyOf:
          - $ref: '#/components/schemas/UserPayload'
          - type: 'null'
      required:
      - application_run_id
      - application_version_id
      - organization_id
      - status
      - triggered_at
      - triggered_by
      title: RunReadResponse
      type: object
    SlugVersionRequest:
      properties:
        application_slug:
          pattern: ^(-?)*$
          title: Application Slug
          type: string
        version:
          title: Version
          type: string
      required:
      - application_slug
      - version
      title: SlugVersionRequest
      type: object
    TransferUrls:
      properties:
        download_url:
          format: uri
          minLength: 1
          title: Download Url
          type: string
        upload_url:
          format: uri
          minLength: 1
          title: Upload Url
          type: string
      required:
      - upload_url
      - download_url
      title: TransferUrls
      type: object
    UserCreationRequest:
      properties:
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        organization_id:
          format: uuid
          title: Organization Id
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - organization_id
      - email
      title: UserCreationRequest
      type: object
    UserPayload:
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
        application_run_id:
          format: uuid
          title: Application Run Id
          type: string
        global_output_artifacts:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PayloadOutputArtifact'
            type: object
          - type: 'null'
          title: Global Output Artifacts
        items:
          items:
            $ref: '#/components/schemas/PayloadItem'
          title: Items
          type: array
      required:
      - application_id
      - application_run_id
      - global_output_artifacts
      - items
      title: UserPayload
      type: object
    UserQuota:
      properties:
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
        used:
          title: Used
          type: integer
      required:
      - total
      - used
      title: UserQuota
      type: object
    UserResponse:
      properties:
        organization_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Organization Id
        slide_quota:
          $ref: '#/components/schemas/UserQuota'
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      required:
      - user_id
      - organization_id
      - slide_quota
      title: UserResponse
      type: object
    UserUpdateRequest:
      properties:
        slide_quota:
          anyOf:
          - type: integer
          - type: 'null'
          title: Slide Quota
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      title: UserUpdateRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VersionCreationRequest:
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
        changelog:
          title: Changelog
          type: string
        flow_id:
          format: uuid
          title: Flow Id
          type: string
        input_artifacts:
          items:
            $ref: '#/components/schemas/InputArtifactSchemaCreationRequest'
          title: Input Artifacts
          type: array
        output_artifacts:
          items:
            $ref: '#/components/schemas/OutputArtifactSchemaCreationRequest'
          title: Output Artifacts
          type: array
        version:
          title: Version
          type: string
      required:
      - version
      - application_id
      - flow_id
      - changelog
      - input_artifacts
      - output_artifacts
      title: VersionCreationRequest
      type: object
    VersionCreationResponse:
      properties:
        application_version_id:
          format: uuid
          title: Application Version Id
          type: string
      required:
      - application_version_id
      title: VersionCreationResponse
      type: object
    VersionReadResponse:
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
        application_version_id:
          format: uuid
          title: Application Version Id
          type: string
        changelog:
          title: Changelog
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        flow_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Flow Id
        input_artifacts:
          items:
            $ref: '#/components/schemas/InputArtifact'
          title: Input Artifacts
          type: array
        output_artifacts:
          items:
            $ref: '#/components/schemas/OutputArtifact'
          title: Output Artifacts
          type: array
        version:
          title: Version
          type: string
      required:
      - application_version_id
      - version
      - application_id
      - changelog
      - input_artifacts
      - output_artifacts
      - created_at
      title: VersionReadResponse
      type: object
  securitySchemes:
    OAuth2AuthorizationCodeBearer:
      flows:
        authorizationCode:
          authorizationUrl: https://dev-8ouohmmrbuh2h4vu.eu.auth0.com/authorize
          scopes: {}
          tokenUrl: https://dev-8ouohmmrbuh2h4vu.eu.auth0.com/oauth/token
      type: oauth2
info:
  description: Pagination is done via `page` and `page_size`. Sorting via `sort`
query
    parameter. sort is a comma-separated list of field names. The sorting 
direction
    can be indicated via `+` (ascending) or `-` (descending) (e.g. 
`/applications?sort=+name)`.
  summary: Interact with Aignostics' Application Platform
  title: Aignostics Platform API
  version: 0.1.0
openapi: 3.1.0
paths:
  /docs:
    get:
      operationId: get_documentation_docs_get
      parameters:
      - in: cookie
        name: access_token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Documentation
  /health:
    get:
      description: Check that the API application is alive and responsive.
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
      tags:
      - Infrastructure
