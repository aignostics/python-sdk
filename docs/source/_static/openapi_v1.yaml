          - format: date-time
            type: string
          - type: 'null'
          examples:
          - '2023-10-05T14:48:00.000Z'
          title: Updated At
      required:
      - id
      title: UserReadResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VersionReadResponse:
      description: Response schema for `Application Version Details` endpoint
      properties:
        application_id:
          description: Application ID
          title: Application Id
          type: string
        application_version_id:
          description: Application version ID
          title: Application Version Id
          type: string
        changelog:
          description: Description of the changes relative to the previous version
          title: Changelog
          type: string
        created_at:
          description: The timestamp when the application version was registered
          format: date-time
          title: Created At
          type: string
        flow_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Flow ID, used internally by the platform
          title: Flow Id
        input_artifacts:
