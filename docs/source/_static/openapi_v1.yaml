          type: array
        version:
          description: Semantic version of the application
          title: Version
          type: string
      required:
      - application_version_id
      - version
      - application_id
      - changelog
      - input_artifacts
      - output_artifacts
      - created_at
      title: VersionReadResponse
      type: object
  securitySchemes:
    OAuth2AuthorizationCodeBearer:
      flows:
        authorizationCode:
