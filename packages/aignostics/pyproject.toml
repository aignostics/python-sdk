[project]
name = "aignostics"
version = "1.4.0"
description = "🔬 Python SDK providing access to the Aignostics Platform. Includes Aignostics Launchpad (Desktop Application), Aignostics CLI (Command-Line Interface), example notebooks, and Aignostics Client Library."
readme = "README.md"
authors = [
    { name = "Helmut Hoffer von Ankershoffen", email = "helmut@aignostics.com" },
    { name = "Andreas Kunft", email = "andreas@aignostics.com" },
]
license = { file = "LICENSE" }

keywords = [
    "aignostics",
    "atlas",
    "whole-slide-imaging",
    "machine-learning",
    "digital-pathology",
    "medical-imaging",
    "qupath",
    "dicom",
    "pydicom",
    "openslide",
    "image-data-commons",
    "act",
    "codecov",
    "copier",
    "cyclonedx",
    "devcontainer",
    "detect-secrets",
    "docker",
    "git-cliff",
    "jupyter",
    "marimo",
    "mypy",
    "nox",
    "nicegui",
    "oe-python-template",
    "pip-audit",
    "pip-licenses",
    "pre-commit",
    "pydantic",
    "pytest",
    "python",
    "pypi",
    "readthedocs",
    "ruff",
    "sonarqube",
    "sonarcloud",
    "sphinx",
    "typer",
    "uv",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Framework :: Pydantic",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Natural Language :: English",
]

# WARNING: The upper bound of requires-python is *not* respected by uvx
requires-python = ">=3.11, <3.15"

dependencies = [
    "aignostics-sdk==1.4.0",
    # Heavy domain deps — WSI, DICOM, cloud storage, data processing
    "boto3>=1.42.4,<2",
    "crc32c>=2.8,<3",
    "defusedxml>=0.7.1",
    "dicom-validator>=0.7.3,<1",
    "dicomweb-client[gcp]>=0.59.3,<1",
    "duckdb>=1.4.2,<=2",
    "fastparquet>=2026.3.0,<2026.4.0; python_version < '3.14'",
    "google-cloud-storage>=3.6.0,<4",
    "highdicom>=0.26.1,<1; python_version < '3.14'",
    "html-sanitizer>=2.6.0,<3",
    "humanize>=4.14.0,<5",
    "idc-index-data==24.0.3",
    "ijson>=3.4.0.post0,<4",
    "openslide-bin>=4.0.0.10,<5",
    "openslide-python>=1.4.3,<2",
    "packaging>=26,<27",
    "pandas>=2.3.3,<4",
    "procrastinate>=3.5.3",
    "pyarrow>=23.0.1,<24; python_version >= '3.14'",
    "pydicom>=3.0.2",
    "python-dateutil>=2.9.0.post0,<3",
    "pyyaml>=6.0.3,<7",
    "s5cmd>=0.3.3,<1",
    "shapely>=2.1.2,<3",
    "wsidicom>=0.28.1,<1",
    # Transitive CVE overrides for heavy deps
    "aiohttp>=3.13.4",
    "lxml>=6.1.0",
    "lxml-html-clean>=0.4.4",
    "marshmallow>=3.26.2",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
pyinstaller = ["pyinstaller>=6.14.0,<7"]
jupyter = [
    "jupyter>=1.1.1,<2",
    # Transitive overrides
    # WARNING: one cannot negate or downgrade a dependency required here. use override-dependencies for that.
    "jupyter-core>=5.8.1",              # CVE-2025-30167
    "jupyterlab>=4.4.9",                # CVE-2025-59842
    "nbconvert>=7.17.1",                # CVE-2025-53000 (>=7.17.0, Dependabot #424); CVE-2026-39377, CVE-2026-39378 (>=7.17.1, Dependabot #553)
]
marimo = [
    "cloudpathlib>=0.23.0,<1",
    "ipython>=9.8.0,<10",
    "marimo>=0.23.0,<1", # GHSA-2679-6mx9-h9xc (Renovate #533)
    "matplotlib>=3.10.7,<4",
    "shapely>=2.1.0,<3",
]
qupath = []

[project.scripts]
aignostics = "aignostics.cli:cli"

[project.urls]
Homepage = "https://aignostics.readthedocs.io/en/latest/"
Documentation = "https://aignostics.readthedocs.io/en/latest/"
Source = "https://github.com/aignostics/python-sdk"
Changelog = "https://github.com/aignostics/python-sdk/releases"
Issues = "https://github.com/aignostics/python-sdk/issues"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/aignostics"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
aignostics-sdk = { workspace = true }
