[project]
name = "aignostics-sdk"
version = "1.4.0"
description = "🔬 Python SDK providing access to the Aignostics Platform. Includes Aignostics Launchpad (Desktop Application), Aignostics CLI (Command-Line Interface), example notebooks, and Aignostics Client Library."
readme = "README.md"
authors = [
    { name = "Helmut Hoffer von Ankershoffen", email = "helmut@aignostics.com" },
    { name = "Andreas Kunft", email = "andreas@aignostics.com" },
]
license = { file = "LICENSE" }

keywords = [
    "aignostics",
    "atlas",
    "whole-slide-imaging",
    "machine-learning",
    "digital-pathology",
    "medical-imaging",
    "qupath",
    "dicom",
    "pydicom",
    "openslide",
    "image-data-commons",
    "act",
    "codecov",
    "copier",
    "cyclonedx",
    "devcontainer",
    "detect-secrets",
    "docker",
    "git-cliff",
    "jupyter",
    "marimo",
    "mypy",
    "nox",
    "nicegui",
    "oe-python-template",
    "pip-audit",
    "pip-licenses",
    "pre-commit",
    "pydantic",
    "pytest",
    "python",
    "pypi",
    "readthedocs",
    "ruff",
    "sonarqube",
    "sonarcloud",
    "sphinx",
    "typer",
    "uv",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Framework :: Pydantic",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Natural Language :: English",
]

# WARNING: The upper bound of requires-python is *not* respected by uvx
requires-python = ">=3.11, <3.15"

dependencies = [
    # From Template
    "fastapi[all,standard]>=0.123.10",
    "nicegui[native]>=3.11.0,<4",  # CVE-2026-21871, CVE-2026-21873, CVE-2026-21874 (>=3.5.0); CVE-2026-25516 (>=3.7.0, #418); CVE-2026-27156 (>=3.8.0, #448); CVE-2026-33332 (>=3.9.0, #498); CVE-2026-39844 (>=3.10.0, #531). 3.11.0 fixes async event handler exception leaks and refines ValueChangeEventArguments generics.
    "platformdirs>=4.5.1,<5",
    "psutil>=7.1.3,<8",
    "pydantic-settings>=2.12.0,<3",
    "pywin32>=311,<312; sys_platform == 'win32'",
    "sentry-sdk>=2.47.0,<3",
    "typer>=0.20.0,<1",
    # Custom — slim platform + utils deps
    "certifi>=2025.11.12",
    "crc32c>=2.8,<3",                    # used in platform/_utils.py for file upload checksums
    "fastmcp>=3.2.0,<4",
    "httpx>=0.28.1,<1",
    "jsonschema[format-nongpl]>=4.25.1,<5",
    "jsf>=0.11.2,<1",
    "loguru>=0.7.3,<1",
    "pyjwt[crypto]>=2.12.0,<3",          # CVE-2026-32597 requires >=2.12.0 (Renovate #475)
    "requests>=2.33.0,<3",               # CVE-2026-25645 requires >= 2.33.0
    "requests-oauthlib>=2.0.0,<3",
    "humanize>=4.14.0,<5",               # used in application/_utils.py for human-readable sizes
    "pyyaml>=6.0.3,<7",                  # used in system/_cli.py for YAML output
    "semver>=3.0.4,<4",
    "tenacity>=9.1.2,<10",
    "tqdm>=4.67.1,<5",
    "truststore>=0.10.4,<1",
    "urllib3>=2.6.3,<3",                 # CVE-2026-21441 requires >= 2.6.3
    # Transitive CVE overrides for slim deps
    # WARNING: one cannot negate or downgrade a dependency required here. use override-dependencies for that.
    "rfc3987; sys_platform == 'never'",  # GPLv3
    "h11>=0.16.0",                       # CVE-2025-43859
    "starlette>=1.0.1",                  # CVE-2025-54121, GHSA-7f5h-v6xp-fcq8, PYSEC-2026-161
    "pillow>=12.2.0",                    # CVE-2025-48379 (>=11.3.0); CVE-2026-25990 (>=12.1.1); CVE-2026-40192 (>=12.2.0)
    "pygments>=2.20.0",                  # CVE-2026-4539 (>=2.20.0); transitive via rich
    "cryptography>=46.0.7",              # CVE-2026-39892 (>=46.0.7); transitive via pyjwt[crypto]
    "pyasn1>=0.6.3",                     # CVE-2026-30922 (>=0.6.3); transitive via cryptography
    "python-multipart>=0.0.26",          # CVE-2026-24486 (>=0.0.22), CVE-2026-40347 (>=0.0.26); transitive via fastapi/starlette
    "tornado>=6.5.5",                    # CVE-2025-47287 (>=6.5.0); GHSA-78cv-mqj4-43f7 (>=6.5.5)
    "filelock>=3.20.3",                  # CVE-2025-68146 (>=3.20.1); CVE-2026-22701 (>=3.20.3)
]
[project.scripts]
aignostics-sdk = "aignostics_sdk.cli:cli"

[project.entry-points."aignostics.cli"]
user        = "aignostics_sdk.platform._cli:cli_user"
sdk         = "aignostics_sdk.platform._cli:cli_sdk"
application = "aignostics_sdk.application._cli:cli"
system      = "aignostics_sdk.system._cli:cli"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/aignostics_sdk", "src/aignx"]

[tool.hatch.metadata]
allow-direct-references = true
