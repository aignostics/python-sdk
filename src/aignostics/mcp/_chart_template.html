<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    #title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 16px; }
    #error { color: #d32f2f; text-align: center; display: none; }
    canvas { max-height: 400px; }
    @media (prefers-color-scheme: dark) {
      #title { color: #e0e0e0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="title"></div>
    <div id="error"></div>
    <canvas id="chart"></canvas>
  </div>

  <script type="module">
    import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";
    const { Chart, registerables } = await import("https://esm.sh/chart.js@4.4.1");
    Chart.register(...registerables);

    const app = new App({ name: "Chart Viewer", version: "1.0.0" });
    let chart = null;

    app.ontoolresult = ({ content }) => {
      try {
        const textContent = content?.find(c => c.type === 'text');
        if (!textContent?.text) throw new Error('No chart data received');

        const data = JSON.parse(textContent.text);
        if (data.error) throw new Error(data.error);

        if (data._meta?.title) {
          document.getElementById('title').textContent = data._meta.title;
        }

        if (chart) chart.destroy();

        const config = { ...data };
        delete config._meta;
        chart = new Chart(document.getElementById('chart'), config);

      } catch (err) {
        document.getElementById('error').textContent = 'Error: ' + err.message;
        document.getElementById('error').style.display = 'block';
      }
    };

    await app.connect();
  </script>
</body>
</html>
